# /etc/nginx/sites-available/overlay.soul-stealer.com
# Danach: ln -s ../sites-available/overlay.soul-stealer.com /etc/nginx/sites-enabled/
#         nginx -t && systemctl reload nginx
#         certbot --nginx -d overlay.soul-stealer.com

server {
    listen 80;
    server_name overlay.soul-stealer.com;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
